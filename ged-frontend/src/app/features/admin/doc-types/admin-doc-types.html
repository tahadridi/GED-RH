<div class="p-8">
  <div class="mb-8">
    <h1 class="text-2xl font-bold text-black-900">Types de documents</h1>
    <p class="text-sm text-gray-500 mt-1">Gérez les types de documents disponibles dans l'application.</p>
  </div>

  <!-- Gradient divider -->
  <div class="mb-8 h-px bg-gradient-to-r from-blue-400 via-purple-400 to-transparent"></div>

  <div class="space-y-8">
    <div class="bg-white rounded-xl shadow-sm border border-gray-100 p-6">
      <h2 class="text-sm font-bold text-gray-800 uppercase tracking-wider mb-4">Nouveau type</h2>
      <div class="grid grid-cols-1 md:grid-cols-3 gap-4">
        <div>
          <label class="block text-xs font-medium text-gray-500 mb-1">Nom</label>
          <input [(ngModel)]="newName" placeholder="Ex: Attestation de travail"
            class="w-full px-3 py-2 border border-gray-200 rounded-lg text-sm focus:outline-none focus:ring-2 focus:ring-blue-800">
        </div>
        <div>
          <label class="block text-xs font-medium text-gray-500 mb-1">Description</label>
          <input [(ngModel)]="newDescription" placeholder="Description courte"
            class="w-full px-3 py-2 border border-gray-200 rounded-lg text-sm focus:outline-none focus:ring-2 focus:ring-blue-800">
        </div>
        <div class="flex items-end">
          <button (click)="add()" [disabled]="!newName.trim()"
            class="w-full py-2 bg-blue-800 text-white rounded-lg text-sm font-medium hover:bg-blue-900 disabled:opacity-50 transition-colors">
            Ajouter
          </button>
        </div>
      </div>
    </div>

    <div *ngIf="loading()" class="text-center text-gray-400 text-sm py-8">Chargement...</div>

    <div *ngIf="!loading() && docTypes().length === 0" class="text-center text-gray-400 text-sm py-8">
      Aucun type de document défini.
    </div>

    <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
      <div *ngFor="let t of docTypes()" class="bg-white rounded-xl shadow-sm border border-gray-100 overflow-hidden">
        <div class="p-4 border-b border-gray-100 bg-gray-50/50 flex items-center justify-between">
          <div class="flex items-center gap-2">
            <div class="w-8 h-8 bg-blue-900 rounded-lg flex items-center justify-center">
              <svg lucideFileText class="w-4 h-4 text-white"></svg>
            </div>
            <h3 class="font-bold text-gray-900">{{ t.name }}</h3>
          </div>
          <button (click)="delete(t.id)" class="p-1.5 text-gray-400 hover:text-red-600 transition-colors">
            <svg lucideTrash2 class="w-4 h-4"></svg>
          </button>
        </div>
        <div class="p-4">
          <p class="text-sm text-gray-500">{{ t.description || 'Aucune description' }}</p>
        </div>
      </div>
    </div>
  </div>
</div>
