<div class="p-8">
  <div class="mb-8">
    <h1 class="text-2xl font-bold text-black-900">Départements</h1>
    <p class="text-sm text-gray-500 mt-1">{{ readonly() ? 'Consultez' : 'Gérez' }} les départements,   et leurs postes.</p>
  </div>

  <div class="space-y-8">
    <!-- Add Department Form -->
    <div *ngIf="!readonly()" class="bg-white rounded-xl shadow-sm border border-gray-100 p-6">
      <h2 class="text-sm font-bold text-black-800 uppercase tracking-wider mb-4">Nouveau Département</h2>
      <div class="grid grid-cols-1 md:grid-cols-3 gap-4">
        <div>
          <label class="block text-xs font-medium text-gray-500 mb-1">Nom du département</label>
          <input [(ngModel)]="newDept.name" placeholder="Ex: Informatique"
            class="w-full px-3 py-2 border border-gray-200 rounded-lg text-sm focus:outline-none focus:ring-2 focus:ring-blue-800">
        </div>
        <div>
          <label class="block text-xs font-medium text-gray-500 mb-1">Préfixe Matricule</label>
          <input [(ngModel)]="newDept.matriculePrefix" placeholder="Ex: INF"
            class="w-full px-3 py-2 border border-gray-200 rounded-lg text-sm focus:outline-none focus:ring-2 focus:ring-blue-800">
        </div>
        <div class="flex items-end">
          <button (click)="addDepartment()" [disabled]="!newDept.name || !newDept.matriculePrefix"
            class="w-full py-2 bg-blue-800 text-white rounded-lg text-sm font-medium hover:bg-blue-900 disabled:opacity-50 transition-colors">
            Créer le département
          </button>
        </div>
      </div>
    </div>

    <!-- Departments List -->
    <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
      <div *ngFor="let dept of departments()" class="bg-white rounded-xl shadow-sm border border-gray-100 overflow-hidden flex flex-col">
        <div class="p-4 border-b border-gray-100 bg-gray-50/50 flex items-center justify-between">
          <div class="flex items-center gap-2">
            <div class="w-8 h-8 bg-blue-900 rounded-lg flex items-center justify-center">
              <svg lucideBuilding class="w-4 h-4 text-white"></svg>
            </div>
            <div>
              <h3 class="font-bold text-gray-900">{{ dept.name }}</h3>
              <p class="text-[10px] text-gray-500 uppercase font-bold tracking-widest">Préfixe : {{ dept.matriculePrefix }}</p>
            </div>
          </div>
          <button *ngIf="!readonly()" (click)="deleteDepartment(dept.id)" class="p-1.5 text-gray-400 hover:text-red-600 transition-colors">
            <svg lucideTrash2 class="w-4 h-4"></svg>
          </button>
        </div>

        <div class="p-4 flex-1 space-y-3">
          <div class="flex items-center justify-between mb-2">
            <h4 class="text-xs font-bold text-gray-400 uppercase tracking-widest">Postes</h4>
            <button *ngIf="!readonly()" (click)="selectedDeptId = (selectedDeptId === dept.id ? null : dept.id)" 
              class="text-[10px] font-bold text-blue-800 hover:text-blue-900 uppercase">
              + Ajouter un poste
            </button>
          </div>

          <!-- Add Position Form (Inline) -->
          <div *ngIf="!readonly() && selectedDeptId === dept.id" class="flex gap-2 p-2 bg-blue-50 rounded-lg border border-blue-100 mb-3 animate-in fade-in slide-in-from-top-1">
            <input [(ngModel)]="newPosTitle" placeholder="Intitulé du poste"
              class="flex-1 px-2 py-1.5 border border-blue-200 rounded text-xs focus:outline-none focus:ring-1 focus:ring-blue-800">
            <button (click)="addPosition(dept.id)" [disabled]="!newPosTitle"
              class="px-3 py-1.5 bg-blue-800 text-white rounded text-xs font-bold hover:bg-blue-900 disabled:opacity-50">
              OK
            </button>
          </div>

          <div class="space-y-1">
            <div *ngFor="let pos of dept.positions" class="flex items-center justify-between p-2 rounded-lg hover:bg-gray-50 group transition-colors border border-transparent hover:border-gray-100">
              <div class="flex items-center gap-2">
                <svg lucideBriefcase class="w-3 h-3 text-gray-400"></svg>
                <span class="text-sm text-gray-700">{{ pos.title }}</span>
              </div>
              <button *ngIf="!readonly()" (click)="deletePosition(pos.id)" 
                class="p-1 text-gray-300 hover:text-red-500 opacity-0 group-hover:opacity-100 transition-all">
                <svg lucideTrash2 class="w-3.5 h-3.5"></svg>
              </button>
            </div>
            <div *ngIf="dept.positions.length === 0" class="py-4 text-center text-gray-400 text-xs italic">
              Aucun poste défini pour ce département.
            </div>
          </div>
        </div>
      </div>
    </div>
  </div>
</div>
