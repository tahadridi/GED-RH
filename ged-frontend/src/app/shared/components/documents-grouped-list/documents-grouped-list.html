<div class="space-y-4">
  <div *ngFor="let group of groups" class="bg-white rounded-[14px] border border-[#e7ecf2] overflow-hidden shadow-[0_6px_22px_rgba(19,35,68,.03)]">
    <!-- Employee header -->
    <button (click)="toggleGroup(group.employeeId)"
      class="w-full flex items-center justify-between px-5 py-3 bg-[#fcfdff] hover:bg-[#f2f6ff] transition-colors border-b border-[#eaeff5]">
      <div class="flex items-center gap-3">
        <div *ngIf="group.employeeHasPhoto; else noPhoto" class="w-9 h-9 rounded-full overflow-hidden shrink-0">
          <img [src]="apiUrl + '/employees/' + group.employeeId + '/photo/content'" alt="Photo"
            class="w-full h-full object-cover">
        </div>
        <ng-template #noPhoto>
          <div class="w-9 h-9 bg-[#3b5bdb] rounded-full flex items-center justify-center text-white text-sm font-bold shrink-0">
            {{ (group.employeeFirstName || '?').charAt(0) }}{{ (group.employeeLastName || '?').charAt(0) }}
          </div>
        </ng-template>
        <div class="text-left">
          <p class="font-bold text-[14px] text-[#17233c]">{{ group.employeeFirstName || '' }} {{ group.employeeLastName || '' }}</p>
          <p class="text-[12px] text-[#8a96a9]">{{ group.employeeMatricule || '—' }} — {{ group.documents.length }} document(s)</p>
        </div>
      </div>
      <svg lucideChevronDown class="w-4 h-4 text-[#9aa5b7] transition-transform"
        [class.rotate-180]="expanded().has(group.employeeId)"></svg>
    </button>

    <!-- Documents table -->
    <div *ngIf="expanded().has(group.employeeId)" class="overflow-x-auto">
      <table class="w-full text-sm">
        <thead class="bg-[#fcfdff] border-b border-[#eaeff5]">
          <tr>
            <th class="text-left px-4 py-2.5 text-[11px] font-extrabold text-[#7b8799] uppercase tracking-wide">Document</th>
            <th class="text-left px-4 py-2.5 text-[11px] font-extrabold text-[#7b8799] uppercase tracking-wide">Type</th>
            <th class="text-left px-4 py-2.5 text-[11px] font-extrabold text-[#7b8799] uppercase tracking-wide">Référence</th>
            <th class="text-left px-4 py-2.5 text-[11px] font-extrabold text-[#7b8799] uppercase tracking-wide">Version</th>
            <th class="text-left px-4 py-2.5 text-[11px] font-extrabold text-[#7b8799] uppercase tracking-wide">Date</th>
            <th class="text-right px-4 py-2.5 text-[11px] font-extrabold text-[#7b8799] uppercase tracking-wide">Actions</th>
          </tr>
        </thead>
        <tbody class="divide-y divide-[#eef2f7]">
          <tr *ngFor="let doc of group.documents" class="hover:bg-[#f2f6ff] transition-colors cursor-pointer" (click)="openVersions(doc)">
            <td class="px-4 py-3">
              <div class="flex items-center gap-3">
                <div class="w-8 h-8 bg-[#edf4ff] rounded-[9px] flex items-center justify-center shrink-0">
                  <svg lucideFileText class="w-4 h-4 text-[#2563eb]"></svg>
                </div>
                <div>
                  <p class="font-semibold text-[13.5px] text-[#17233c]">{{ doc.name }}</p>
                  <p class="text-[12px] text-[#9aa5b7]">{{ doc.author }}</p>
                </div>
              </div>
            </td>
            <td class="px-4 py-3">
              <span class="px-2.5 py-1 rounded-full text-[11.5px] font-semibold bg-[#edf4ff] text-[#2563eb]">
                {{ docTypeLabels[doc.type] }}
              </span>
            </td>
            <td class="px-4 py-3 font-mono text-[12px] text-[#66738a]">{{ doc.documentReference }}</td>
            <td class="px-4 py-3 text-[13px] text-[#66738a]">v{{ doc.currentVersion }}</td>
            <td class="px-4 py-3 text-[12.5px] text-[#8a96a9]">{{ doc.createdAt | date:'dd/MM/yyyy' }}</td>
            <td class="px-4 py-3">
              <div class="flex items-center justify-end gap-1" (click)="$event.stopPropagation()">
                <button (click)="openVersions(doc)" title="Versions"
                  class="p-1.5 text-[#9aa5b7] hover:text-[#7c3aed] hover:bg-[#f3edff] rounded-[8px] transition-colors">
                  <svg lucideLayers class="w-4 h-4"></svg>
                </button>
                <button (click)="download(doc)" title="Télécharger"
                  class="p-1.5 text-[#9aa5b7] hover:text-[#16a34a] hover:bg-[#eaf8ef] rounded-[8px] transition-colors">
                  <svg lucideDownload class="w-4 h-4"></svg>
                </button>
              </div>
            </td>
          </tr>
        </tbody>
      </table>
    </div>
  </div>
</div>

<app-documents-versions-modal
  [show]="showVersions()"
  [doc]="selectedDoc()"
  [versions]="versions()"
  (close)="showVersions.set(false)" />
