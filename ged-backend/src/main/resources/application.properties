spring.application.name=ged-backend
server.port=8080

## Datasource (supports Supabase Postgres via env)
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/Gestion_Administratif}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.jdbc.time_zone=UTC
spring.autoconfigure.exclude=org.springframework.boot.autoconfigure.security.servlet.UserDetailsServiceAutoConfiguration

app.security.allowed-origins=http://localhost:4200

## Supabase admin configuration (Auth)
app.supabase.enabled=true
app.supabase.url=${SUPABASE_URL:}
app.supabase.service-role-key=${SUPABASE_SERVICE_ROLE_KEY:}
app.supabase.jwks-url=${SUPABASE_JWKS_URL:}

## MinIO Storage Configuration
app.minio.url=${MINIO_URL:http://localhost:9000}
app.minio.access-key=${MINIO_ACCESS_KEY}
app.minio.secret-key=${MINIO_SECRET_KEY}
app.minio.bucket-name=${MINIO_BUCKET:ged-rh}

## Swagger / OpenAPI
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.api-docs.path=/v3/api-docs
springdoc.default-produces-media-type=application/json
springdoc.show-actuator=true

## File upload limits
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB

## OCR Configuration
app.ocr.tess-data-path=${TESSDATA_PATH:C:/Users/tahad/AppData/Local/Programs/Tesseract-OCR/tessdata}
app.ocr.default-language=fra